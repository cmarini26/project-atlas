services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: northwind_wordpress
      MARIADB_USER: northwind
      MARIADB_PASSWORD: northwind-local-only
      MARIADB_ROOT_PASSWORD: northwind-root-local-only
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: northwind_wordpress
      WORDPRESS_DB_USER: northwind
      WORDPRESS_DB_PASSWORD: northwind-local-only
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - wordpress-data:/var/www/html

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: northwind_wordpress
      WORDPRESS_DB_USER: northwind
      WORDPRESS_DB_PASSWORD: northwind-local-only
    user: "33:33"
    volumes:
      - wordpress-data:/var/www/html
      - ./site:/opt/northwind-site:ro

volumes:
  database-data:
  wordpress-data:
