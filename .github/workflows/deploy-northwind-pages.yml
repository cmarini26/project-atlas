name: Deploy Northwind Test Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/testing/site-prototype/**
      - .github/workflows/deploy-northwind-pages.yml

concurrency:
  group: northwind-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publish synthetic Northwind site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload synthetic site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/testing/site-prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
